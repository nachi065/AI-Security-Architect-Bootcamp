<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" class="g-svg" viewBox="0 0 800 330" width="800" height="330" role="img" aria-label="EU AI Act risk tiers"><title>EU AI Act risk tiers</title><style>
.g-svg{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif}
.g-text{fill:#1f2933;font-size:13px}
.g-b{font-weight:700}
.g-s{font-size:11px}
.g-xs{font-size:10px}
.g-m{fill:#5b6b7b}
.g-tbad{fill:#b02a2a}
.g-tgood{fill:#1b7a44}
.g-twarn{fill:#8a6400}
.g-tprim{fill:#2b3990}
.g-ton{fill:#ffffff}
.g-r{stroke-width:1.3}
.g-r-box{fill:#f3f5f9;stroke:#9aa7b8}
.g-r-primary{fill:#e4e9ff;stroke:#4051b5}
.g-r-good{fill:#e3f6ea;stroke:#2e9e5b}
.g-r-warn{fill:#fff3d6;stroke:#d9a000}
.g-r-bad{fill:#fde7e7;stroke:#d64545}
.g-r-zone{fill:none;stroke:#5b6b7b;stroke-dasharray:6 4}
.g-r-zonebad{fill:none;stroke:#d64545;stroke-dasharray:6 4}
.g-r-lv1{fill:#eef0fb;stroke:none}
.g-r-lv2{fill:#cdd3f4;stroke:none}
.g-r-lv3{fill:#9aa6e8;stroke:none}
.g-r-lv4{fill:#5c6dd0;stroke:none}
.g-r-lv5{fill:#2f3fa6;stroke:none}
.g-p{stroke:#5b6b7b;stroke-width:1.6;fill:none}
.g-pbad{stroke:#d64545;stroke-width:1.6;fill:none}
.g-pgood{stroke:#2e9e5b;stroke-width:1.6;fill:none}
.g-pwarn{stroke:#d9a000;stroke-width:1.6;fill:none}
.g-dash{stroke-dasharray:5 4}
.g-ah{fill:#5b6b7b}
.g-ah-bad{fill:#d64545}
.g-ah-good{fill:#2e9e5b}
.g-today{stroke:#d64545;stroke-width:1.4;stroke-dasharray:3 3}
</style><defs><marker id="eu-tiers-a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path class="g-ah" d="M0,0 L10,5 L0,10 z"/></marker><marker id="eu-tiers-ab" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path class="g-ah-bad" d="M0,0 L10,5 L0,10 z"/></marker><marker id="eu-tiers-ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path class="g-ah-good" d="M0,0 L10,5 L0,10 z"/></marker></defs><polygon class="g-r g-r-bad" points="174.0,18.0 246.0,18.0 279.9,80.0 140.1,80.0"/><text class="g-text g-b g-tbad" x="210.0" y="53.0" text-anchor="middle">Prohibited</text><path class="g-p g-dash" d="M268.9 49.0 L428.0 49.0"/><text class="g-text g-s" x="436.0" y="53.0" text-anchor="start">Banned outright (Article 5)</text><polygon class="g-r g-r-warn" points="135.8,88.0 284.2,88.0 318.1,150.0 101.9,150.0"/><text class="g-text g-b g-twarn" x="210.0" y="123.0" text-anchor="middle">High-risk</text><path class="g-p g-dash" d="M307.2 119.0 L428.0 119.0"/><text class="g-text g-s" x="436.0" y="109.0" text-anchor="start">Strict duties for Annex III uses and Annex I</text><text class="g-text g-s" x="436.0" y="123.0" text-anchor="start">products: risk management, data governance,</text><text class="g-text g-s" x="436.0" y="137.0" text-anchor="start">logging, human oversight, conformity assessment</text><polygon class="g-r g-r-primary" points="97.5,158.0 322.5,158.0 356.3,220.0 63.7,220.0"/><text class="g-text g-b g-tprim" x="210.0" y="193.0" text-anchor="middle">Transparency</text><path class="g-p g-dash" d="M345.4 189.0 L428.0 189.0"/><text class="g-text g-s" x="436.0" y="186.0" text-anchor="start">Tell people they are dealing with AI; label</text><text class="g-text g-s" x="436.0" y="200.0" text-anchor="start">synthetic content (Article 50)</text><polygon class="g-r g-r-good" points="59.3,228.0 360.7,228.0 394.5,290.0 25.5,290.0"/><text class="g-text g-b g-tgood" x="210.0" y="263.0" text-anchor="middle">Minimal</text><path class="g-p g-dash" d="M383.6 259.0 L428.0 259.0"/><text class="g-text g-s" x="436.0" y="263.0" text-anchor="start">No specific obligations</text><text class="g-text g-s g-m" x="20.0" y="322.0" text-anchor="start">General-purpose AI models have their own, separate obligations.</text></svg>
