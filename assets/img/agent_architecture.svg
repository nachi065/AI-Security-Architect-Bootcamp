</style><defs><marker id="agent-architecture-a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path class="g-ah" d="M0,0 L10,5 L0,10 z"/></marker><marker id="agent-architecture-ab" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path class="g-ah-bad" d="M0,0 L10,5 L0,10 z"/></marker><marker id="agent-architecture-ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path class="g-ah-good" d="M0,0 L10,5 L0,10 z"/></marker></defs><rect class="g-r g-r-warn" x="20.0" y="100.0" width="156.0" height="96.0" rx="8"/><text class="g-text g-b" x="98.0" y="129.7" text-anchor="middle" style="font-size:12px">Agent</text><text class="g-text" x="98.0" y="144.7" text-anchor="middle" style="font-size:12px">its own identity</text><text class="g-text" x="98.0" y="159.7" text-anchor="middle" style="font-size:12px">short-lived,</text><text class="g-text" x="98.0" y="174.7" text-anchor="middle" style="font-size:12px">scoped tokens</text><rect class="g-r g-r-good" x="236.0" y="40.0" width="250.0" height="232.0" rx="8"/><text class="g-text g-b g-tgood" x="361.0" y="62.0" text-anchor="middle">Tool gateway</text><text class="g-text g-s" x="361.0" y="96.0" text-anchor="middle">allow-list of tools</text><path class="g-p g-dash" d="M290.0 107.0 L432.0 107.0"/><text class="g-text g-s" x="361.0" y="126.0" text-anchor="middle">argument schemas</text><path class="g-p g-dash" d="M290.0 137.0 L432.0 137.0"/><text class="g-text g-s" x="361.0" y="156.0" text-anchor="middle">policy check (outside the model)</text><path class="g-p g-dash" d="M290.0 167.0 L432.0 167.0"/><text class="g-text g-s" x="361.0" y="186.0" text-anchor="middle">rate, cost and step limits</text><path class="g-p g-dash" d="M290.0 197.0 L432.0 197.0"/><text class="g-text g-s" x="361.0" y="216.0" text-anchor="middle">audit log of every call</text><rect class="g-r g-r-primary" x="524.0" y="40.0" width="124.0" height="76.0" rx="8"/><text class="g-text g-b" x="586.0" y="59.7" text-anchor="middle" style="font-size:12px">Human approval</text><text class="g-text" x="586.0" y="74.7" text-anchor="middle" style="font-size:12px">high-impact only,</text><text class="g-text" x="586.0" y="89.7" text-anchor="middle" style="font-size:12px">bound to the</text><text class="g-text" x="586.0" y="104.7" text-anchor="middle" style="font-size:12px">exact request</text><rect class="g-r g-r-box" x="668.0" y="40.0" width="112.0" height="76.0" rx="8"/><text class="g-text g-b" x="724.0" y="67.2" text-anchor="middle" style="font-size:12px">Secrets vault</text><text class="g-text" x="724.0" y="82.2" text-anchor="middle" style="font-size:12px">agent never</text><text class="g-text" x="724.0" y="97.2" text-anchor="middle" style="font-size:12px">sees secrets</text><rect class="g-r g-r-good" x="524.0" y="172.0" width="256.0" height="70.0" rx="8"/><text class="g-text g-b" x="652.0" y="195.5" text-anchor="middle" style="font-size:12px">Sandboxed tools</text><text class="g-text" x="652.0" y="211.5" text-anchor="middle" style="font-size:12px">no network by default · read-only</text><text class="g-text" x="652.0" y="227.5" text-anchor="middle" style="font-size:12px">CPU, memory and time limits</text><path class="g-p" d="M178.0 148.0 L234.0 148.0" marker-end="url(#agent-architecture-a)"/><text class="g-text g-xs g-m" x="206.0" y="140.0" text-anchor="middle">proposal</text><path class="g-p" d="M488.0 78.0 L522.0 78.0" marker-end="url(#agent-architecture-a)"/><path class="g-p" d="M586.0 116.0 L586.0 170.0" marker-end="url(#agent-architecture-a)"/><path class="g-p" d="M488.0 207.0 L522.0 207.0" marker-end="url(#agent-architecture-a)"/><text class="g-text g-xs g-m" x="505.0" y="198.0" text-anchor="middle">low</text><path class="g-p" d="M724.0 116.0 L724.0 170.0" marker-end="url(#agent-architecture-a)"/><text class="g-text g-xs g-m" x="718.0" y="140.0" text-anchor="end">credentials added</text><text class="g-text g-xs g-m" x="718.0" y="152.0" text-anchor="end">by the tool layer</text><rect class="g-r g-r-bad" x="20.0" y="218.0" width="156.0" height="54.0" rx="8"/><text class="g-text g-b g-tbad" x="98.0" y="234.2" text-anchor="middle" style="font-size:12px">Kill switch</text><text class="g-text" x="98.0" y="249.2" text-anchor="middle" style="font-size:12px">disable tool or</text><text class="g-text" x="98.0" y="264.2" text-anchor="middle" style="font-size:12px">revoke token</text><path class="g-pbad g-dash" d="M176.0 245.0 L236.0 245.0" marker-end="url(#agent-architecture-ab)"/><rect class="g-r g-r-box" x="236.0" y="296.0" width="250.0" height="38.0" rx="8"/><text class="g-text g-b" x="361.0" y="319.5" text-anchor="middle" style="font-size:12px">Telemetry to SIEM: detections</text><path class="g-p" d="M361.0 272.0 L361.0 296.0" marker-end="url(#agent-architecture-a)"/></svg>
