</style><defs><marker id="rag-pipeline-a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path class="g-ah" d="M0,0 L10,5 L0,10 z"/></marker><marker id="rag-pipeline-ab" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path class="g-ah-bad" d="M0,0 L10,5 L0,10 z"/></marker><marker id="rag-pipeline-ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path class="g-ah-good" d="M0,0 L10,5 L0,10 z"/></marker></defs><text class="g-text g-b g-s g-m" x="20.0" y="28.0" text-anchor="start">INGEST (offline)</text><text class="g-text g-b g-s g-m" x="20.0" y="178.0" text-anchor="start">QUERY (online)</text><rect class="g-r g-r-box" x="20.0" y="44.0" width="112.0" height="56.0" rx="8"/><text class="g-text g-b" x="76.0" y="68.5" text-anchor="middle" style="font-size:12px">Documents</text><text class="g-text" x="76.0" y="84.5" text-anchor="middle" style="font-size:12px">your corpus</text><rect class="g-r g-r-primary" x="166.0" y="44.0" width="100.0" height="56.0" rx="8"/><text class="g-text g-b" x="216.0" y="68.5" text-anchor="middle" style="font-size:12px">Chunk</text><text class="g-text" x="216.0" y="84.5" text-anchor="middle" style="font-size:12px">split + overlap</text><rect class="g-r g-r-primary" x="300.0" y="44.0" width="100.0" height="56.0" rx="8"/><text class="g-text g-b" x="350.0" y="68.5" text-anchor="middle" style="font-size:12px">Embed</text><text class="g-text" x="350.0" y="84.5" text-anchor="middle" style="font-size:12px">text to vectors</text><rect class="g-r g-r-primary" x="434.0" y="44.0" width="170.0" height="56.0" rx="8"/><text class="g-text g-b" x="519.0" y="61.2" text-anchor="middle" style="font-size:12px">Vector store</text><text class="g-text" x="519.0" y="76.2" text-anchor="middle" style="font-size:12px">chunks + metadata</text><text class="g-text" x="519.0" y="91.2" text-anchor="middle" style="font-size:12px">(owner, class)</text><path class="g-p" d="M134.0 72.0 L164.0 72.0" marker-end="url(#rag-pipeline-a)"/><path class="g-p" d="M268.0 72.0 L298.0 72.0" marker-end="url(#rag-pipeline-a)"/><path class="g-p" d="M402.0 72.0 L432.0 72.0" marker-end="url(#rag-pipeline-a)"/><rect class="g-r g-r-box" x="20.0" y="194.0" width="100.0" height="56.0" rx="8"/><text class="g-text g-b" x="70.0" y="218.5" text-anchor="middle" style="font-size:12px">Question</text><text class="g-text" x="70.0" y="234.5" text-anchor="middle" style="font-size:12px">from the user</text><rect class="g-r g-r-primary" x="152.0" y="194.0" width="90.0" height="56.0" rx="8"/><text class="g-text g-b" x="197.0" y="218.5" text-anchor="middle" style="font-size:12px">Embed</text><text class="g-text" x="197.0" y="234.5" text-anchor="middle" style="font-size:12px">the query</text><rect class="g-r g-r-primary" x="274.0" y="194.0" width="190.0" height="64.0" rx="8"/><text class="g-text g-b" x="369.0" y="215.2" text-anchor="middle" style="font-size:12px">Retrieve</text><text class="g-text" x="369.0" y="230.2" text-anchor="middle" style="font-size:12px">vector + keyword search</text><text class="g-text" x="369.0" y="245.2" text-anchor="middle" style="font-size:12px">rank fusion, filters</text><rect class="g-r g-r-primary" x="496.0" y="194.0" width="104.0" height="56.0" rx="8"/><text class="g-text g-b" x="548.0" y="218.5" text-anchor="middle" style="font-size:12px">Build prompt</text><text class="g-text" x="548.0" y="234.5" text-anchor="middle" style="font-size:12px">rules + context</text><rect class="g-r g-r-warn" x="632.0" y="194.0" width="70.0" height="56.0" rx="8"/><text class="g-text g-b" x="667.0" y="226.5" text-anchor="middle" style="font-size:12px">LLM</text><rect class="g-r g-r-good" x="722.0" y="194.0" width="62.0" height="56.0" rx="8"/><text class="g-text g-b" x="753.0" y="226.5" text-anchor="middle" style="font-size:12px">Answer</text><path class="g-p" d="M122.0 222.0 L150.0 222.0" marker-end="url(#rag-pipeline-a)"/><path class="g-p" d="M244.0 222.0 L272.0 222.0" marker-end="url(#rag-pipeline-a)"/><path class="g-p" d="M466.0 222.0 L494.0 222.0" marker-end="url(#rag-pipeline-a)"/><path class="g-p" d="M602.0 222.0 L630.0 222.0" marker-end="url(#rag-pipeline-a)"/><path class="g-p" d="M704.0 222.0 L720.0 222.0" marker-end="url(#rag-pipeline-a)"/><path class="g-p" d="M519.0 100.0 L519.0 140.0 L369.0 140.0 L369.0 194.0" marker-end="url(#rag-pipeline-a)"/><text class="g-text g-s g-m" x="444.0" y="134.0" text-anchor="middle">similar chunks</text><rect class="g-r g-r-bad" x="636.0" y="46.0" width="146.0" height="52.0" rx="8"/><text class="g-text g-b g-tbad" x="709.0" y="68.5" text-anchor="middle" style="font-size:12px">Poisoned</text><text class="g-text" x="709.0" y="84.5" text-anchor="middle" style="font-size:12px">document added</text><path class="g-pbad" d="M634.0 72.0 L606.0 72.0" marker-end="url(#rag-pipeline-ab)"/><rect class="g-r g-r-bad" x="430.0" y="276.0" width="236.0" height="38.0" rx="8"/><text class="g-text g-b g-tbad" x="548.0" y="299.5" text-anchor="middle" style="font-size:12px">Retrieved text is untrusted input</text><path class="g-pbad g-dash" d="M548.0 276.0 L548.0 252.0" marker-end="url(#rag-pipeline-ab)"/></svg>
