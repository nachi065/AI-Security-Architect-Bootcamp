<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" class="g-svg" viewBox="0 0 800 262" width="800" height="262" role="img" aria-label="Attack tree for an agent performing an unauthorised action"><title>Attack tree for an agent performing an unauthorised action</title><style>
.g-svg{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif}
.g-text{fill:#1f2933;font-size:13px}
.g-b{font-weight:700}
.g-s{font-size:11px}
.g-xs{font-size:10px}
.g-m{fill:#5b6b7b}
.g-tbad{fill:#b02a2a}
.g-tgood{fill:#1b7a44}
.g-twarn{fill:#8a6400}
.g-tprim{fill:#2b3990}
.g-ton{fill:#ffffff}
.g-r{stroke-width:1.3}
.g-r-box{fill:#f3f5f9;stroke:#9aa7b8}
.g-r-primary{fill:#e4e9ff;stroke:#4051b5}
.g-r-good{fill:#e3f6ea;stroke:#2e9e5b}
.g-r-warn{fill:#fff3d6;stroke:#d9a000}
.g-r-bad{fill:#fde7e7;stroke:#d64545}
.g-r-zone{fill:none;stroke:#5b6b7b;stroke-dasharray:6 4}
.g-r-zonebad{fill:none;stroke:#d64545;stroke-dasharray:6 4}
.g-r-lv1{fill:#eef0fb;stroke:none}
.g-r-lv2{fill:#cdd3f4;stroke:none}
.g-r-lv3{fill:#9aa6e8;stroke:none}
.g-r-lv4{fill:#5c6dd0;stroke:none}
.g-r-lv5{fill:#2f3fa6;stroke:none}
.g-p{stroke:#5b6b7b;stroke-width:1.6;fill:none}
.g-pbad{stroke:#d64545;stroke-width:1.6;fill:none}
.g-pgood{stroke:#2e9e5b;stroke-width:1.6;fill:none}
.g-pwarn{stroke:#d9a000;stroke-width:1.6;fill:none}
.g-dash{stroke-dasharray:5 4}
.g-ah{fill:#5b6b7b}
.g-ah-bad{fill:#d64545}
.g-ah-good{fill:#2e9e5b}
.g-today{stroke:#d64545;stroke-width:1.4;stroke-dasharray:3 3}
</style><defs><marker id="attack-tree-a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path class="g-ah" d="M0,0 L10,5 L0,10 z"/></marker><marker id="attack-tree-ab" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path class="g-ah-bad" d="M0,0 L10,5 L0,10 z"/></marker><marker id="attack-tree-ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path class="g-ah-good" d="M0,0 L10,5 L0,10 z"/></marker></defs><rect class="g-r g-r-bad" x="225.0" y="14.0" width="350.0" height="46.0" rx="8"/><text class="g-text g-b g-tbad" x="400.0" y="41.5" text-anchor="middle">Agent performs an unauthorised action</text><path class="g-pbad" d="M400.0 60.0 L400.0 90.0"/><path class="g-pbad" d="M90.0 90.0 L710.0 90.0"/><path class="g-pbad" d="M90.0 90.0 L90.0 116.0" marker-end="url(#attack-tree-ab)"/><rect class="g-r g-r-box" x="20.0" y="118.0" width="140.0" height="60.0" rx="8"/><text class="g-text g-b" x="90.0" y="144.5" text-anchor="middle" style="font-size:12px">Hijack via</text><text class="g-text" x="90.0" y="160.5" text-anchor="middle" style="font-size:12px">a retrieved document</text><text class="g-text g-xs g-m" x="90.0" y="202.0" text-anchor="middle">test:</text><text class="g-text g-xs" x="90.0" y="216.0" text-anchor="middle">measure hijack rate</text><path class="g-pbad" d="M245.0 90.0 L245.0 116.0" marker-end="url(#attack-tree-ab)"/><rect class="g-r g-r-box" x="175.0" y="118.0" width="140.0" height="60.0" rx="8"/><text class="g-text g-b" x="245.0" y="144.5" text-anchor="middle" style="font-size:12px">Poisoned tool</text><text class="g-text" x="245.0" y="160.5" text-anchor="middle" style="font-size:12px">description</text><text class="g-text g-xs g-m" x="245.0" y="202.0" text-anchor="middle">test:</text><text class="g-text g-xs" x="245.0" y="216.0" text-anchor="middle">edit your own MCP server</text><path class="g-pbad" d="M400.0 90.0 L400.0 116.0" marker-end="url(#attack-tree-ab)"/><rect class="g-r g-r-box" x="330.0" y="118.0" width="140.0" height="60.0" rx="8"/><text class="g-text g-b" x="400.0" y="144.5" text-anchor="middle" style="font-size:12px">Over-broad tool</text><text class="g-text" x="400.0" y="160.5" text-anchor="middle" style="font-size:12px">or identity</text><text class="g-text g-xs g-m" x="400.0" y="202.0" text-anchor="middle">test:</text><text class="g-text g-xs" x="400.0" y="216.0" text-anchor="middle">identity versus task</text><path class="g-pbad" d="M555.0 90.0 L555.0 116.0" marker-end="url(#attack-tree-ab)"/><rect class="g-r g-r-box" x="485.0" y="118.0" width="140.0" height="60.0" rx="8"/><text class="g-text g-b" x="555.0" y="144.5" text-anchor="middle" style="font-size:12px">Memory write</text><text class="g-text" x="555.0" y="160.5" text-anchor="middle" style="font-size:12px">persists</text><text class="g-text g-xs g-m" x="555.0" y="202.0" text-anchor="middle">test:</text><text class="g-text g-xs" x="555.0" y="216.0" text-anchor="middle">poison, then new session</text><path class="g-pbad" d="M710.0 90.0 L710.0 116.0" marker-end="url(#attack-tree-ab)"/><rect class="g-r g-r-box" x="640.0" y="118.0" width="140.0" height="60.0" rx="8"/><text class="g-text g-b" x="710.0" y="144.5" text-anchor="middle" style="font-size:12px">Misleading</text><text class="g-text" x="710.0" y="160.5" text-anchor="middle" style="font-size:12px">approval prompt</text><text class="g-text g-xs g-m" x="710.0" y="202.0" text-anchor="middle">test:</text><text class="g-text g-xs" x="710.0" y="216.0" text-anchor="middle">would a reviewer notice?</text></svg>
