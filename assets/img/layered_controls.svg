<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" class="g-svg" viewBox="0 0 800 270" width="800" height="270" role="img" aria-label="Layered runtime controls around a model"><title>Layered runtime controls around a model</title><style>
.g-svg{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif}
.g-text{fill:#1f2933;font-size:13px}
.g-b{font-weight:700}
.g-s{font-size:11px}
.g-xs{font-size:10px}
.g-m{fill:#5b6b7b}
.g-tbad{fill:#b02a2a}
.g-tgood{fill:#1b7a44}
.g-twarn{fill:#8a6400}
.g-tprim{fill:#2b3990}
.g-ton{fill:#ffffff}
.g-r{stroke-width:1.3}
.g-r-box{fill:#f3f5f9;stroke:#9aa7b8}
.g-r-primary{fill:#e4e9ff;stroke:#4051b5}
.g-r-good{fill:#e3f6ea;stroke:#2e9e5b}
.g-r-warn{fill:#fff3d6;stroke:#d9a000}
.g-r-bad{fill:#fde7e7;stroke:#d64545}
.g-r-zone{fill:none;stroke:#5b6b7b;stroke-dasharray:6 4}
.g-r-zonebad{fill:none;stroke:#d64545;stroke-dasharray:6 4}
.g-r-lv1{fill:#eef0fb;stroke:none}
.g-r-lv2{fill:#cdd3f4;stroke:none}
.g-r-lv3{fill:#9aa6e8;stroke:none}
.g-r-lv4{fill:#5c6dd0;stroke:none}
.g-r-lv5{fill:#2f3fa6;stroke:none}
.g-p{stroke:#5b6b7b;stroke-width:1.6;fill:none}
.g-pbad{stroke:#d64545;stroke-width:1.6;fill:none}
.g-pgood{stroke:#2e9e5b;stroke-width:1.6;fill:none}
.g-pwarn{stroke:#d9a000;stroke-width:1.6;fill:none}
.g-dash{stroke-dasharray:5 4}
.g-ah{fill:#5b6b7b}
.g-ah-bad{fill:#d64545}
.g-ah-good{fill:#2e9e5b}
.g-today{stroke:#d64545;stroke-width:1.4;stroke-dasharray:3 3}
</style><defs><marker id="layered-controls-a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path class="g-ah" d="M0,0 L10,5 L0,10 z"/></marker><marker id="layered-controls-ab" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path class="g-ah-bad" d="M0,0 L10,5 L0,10 z"/></marker><marker id="layered-controls-ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path class="g-ah-good" d="M0,0 L10,5 L0,10 z"/></marker></defs><rect class="g-r g-r-box" x="14.0" y="54.0" width="100.0" height="76.0" rx="8"/><text class="g-text g-b" x="64.0" y="96.2" text-anchor="middle" style="font-size:11px">User</text><rect class="g-r g-r-good" x="126.0" y="54.0" width="100.0" height="76.0" rx="8"/><text class="g-text g-b" x="176.0" y="81.2" text-anchor="middle" style="font-size:11px">Gateway</text><text class="g-text" x="176.0" y="96.2" text-anchor="middle" style="font-size:11px">auth, limits,</text><text class="g-text" x="176.0" y="111.2" text-anchor="middle" style="font-size:11px">logging</text><rect class="g-r g-r-warn" x="238.0" y="54.0" width="100.0" height="76.0" rx="8"/><text class="g-text g-b" x="288.0" y="88.7" text-anchor="middle" style="font-size:11px">Input checks</text><text class="g-text" x="288.0" y="103.7" text-anchor="middle" style="font-size:11px">screening</text><rect class="g-r g-r-good" x="350.0" y="54.0" width="100.0" height="76.0" rx="8"/><text class="g-text g-b" x="400.0" y="81.2" text-anchor="middle" style="font-size:11px">Retrieval</text><text class="g-text" x="400.0" y="96.2" text-anchor="middle" style="font-size:11px">access</text><text class="g-text" x="400.0" y="111.2" text-anchor="middle" style="font-size:11px">filter</text><rect class="g-r g-r-bad" x="462.0" y="54.0" width="100.0" height="76.0" rx="8"/><text class="g-text g-b" x="512.0" y="81.2" text-anchor="middle" style="font-size:11px">Model</text><text class="g-text" x="512.0" y="96.2" text-anchor="middle" style="font-size:11px">can be</text><text class="g-text" x="512.0" y="111.2" text-anchor="middle" style="font-size:11px">manipulated</text><rect class="g-r g-r-warn" x="574.0" y="54.0" width="100.0" height="76.0" rx="8"/><text class="g-text g-b" x="624.0" y="88.7" text-anchor="middle" style="font-size:11px">Output checks</text><text class="g-text" x="624.0" y="103.7" text-anchor="middle" style="font-size:11px">canaries, PII</text><rect class="g-r g-r-good" x="686.0" y="54.0" width="100.0" height="76.0" rx="8"/><text class="g-text g-b" x="736.0" y="81.2" text-anchor="middle" style="font-size:11px">Tool gate</text><text class="g-text" x="736.0" y="96.2" text-anchor="middle" style="font-size:11px">policy, schema,</text><text class="g-text" x="736.0" y="111.2" text-anchor="middle" style="font-size:11px">limits</text><path class="g-p" d="M115.0 92.0 L125.0 92.0" marker-end="url(#layered-controls-a)"/><path class="g-p" d="M227.0 92.0 L237.0 92.0" marker-end="url(#layered-controls-a)"/><path class="g-p" d="M339.0 92.0 L349.0 92.0" marker-end="url(#layered-controls-a)"/><path class="g-p" d="M451.0 92.0 L461.0 92.0" marker-end="url(#layered-controls-a)"/><path class="g-p" d="M563.0 92.0 L573.0 92.0" marker-end="url(#layered-controls-a)"/><path class="g-p" d="M675.0 92.0 L685.0 92.0" marker-end="url(#layered-controls-a)"/><text class="g-text g-s g-m" x="400.0" y="30.0" text-anchor="middle">Every request passes through independent layers</text><rect class="g-r g-r-good" x="40.0" y="167.0" width="16.0" height="16.0" rx="4"/><text class="g-text" x="66.0" y="180.0" text-anchor="start" style="font-size:12px">Enforced outside the model: code, policy engine, infrastructure</text><rect class="g-r g-r-warn" x="40.0" y="193.0" width="16.0" height="16.0" rx="4"/><text class="g-text" x="66.0" y="206.0" text-anchor="start" style="font-size:12px">Probabilistic filters: measure block rate and false-positive rate</text><rect class="g-r g-r-bad" x="40.0" y="219.0" width="16.0" height="16.0" rx="4"/><text class="g-text" x="66.0" y="232.0" text-anchor="start" style="font-size:12px">The model itself: assume it can be manipulated</text></svg>
