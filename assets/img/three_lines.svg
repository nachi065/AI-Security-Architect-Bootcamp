<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" class="g-svg" viewBox="0 0 800 318" width="800" height="318" role="img" aria-label="Three lines of defence for AI governance"><title>Three lines of defence for AI governance</title><style>
.g-svg{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif}
.g-text{fill:#1f2933;font-size:13px}
.g-b{font-weight:700}
.g-s{font-size:11px}
.g-xs{font-size:10px}
.g-m{fill:#5b6b7b}
.g-tbad{fill:#b02a2a}
