<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" class="g-svg" viewBox="0 0 800 250" width="800" height="250" role="img" aria-label="Permission-aware retrieval: identity from the token, filtering at query time"><title>Permission-aware retrieval: identity from the token, filtering at query time</title><style>
.g-svg{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif}
.g-text{fill:#1f2933;font-size:13px}
.g-b{font-weight:700}
.g-s{font-size:11px}
.g-xs{font-size:10px}
.g-m{fill:#5b6b7b}
.g-tbad{fill:#b02a2a}
.g-tgood{fill:#1b7a44}
.g-twarn{fill:#8a6400}
.g-tprim{fill:#2b3990}
.g-ton{fill:#ffffff}
.g-r{stroke-width:1.3}
.g-r-box{fill:#f3f5f9;stroke:#9aa7b8}
.g-r-primary{fill:#e4e9ff;stroke:#4051b5}
.g-r-good{fill:#e3f6ea;stroke:#2e9e5b}
.g-r-warn{fill:#fff3d6;stroke:#d9a000}
.g-r-bad{fill:#fde7e7;stroke:#d64545}
.g-r-zone{fill:none;stroke:#5b6b7b;stroke-dasharray:6 4}
.g-r-zonebad{fill:none;stroke:#d64545;stroke-dasharray:6 4}
.g-r-lv1{fill:#eef0fb;stroke:none}
.g-r-lv2{fill:#cdd3f4;stroke:none}
.g-r-lv3{fill:#9aa6e8;stroke:none}
.g-r-lv4{fill:#5c6dd0;stroke:none}
.g-r-lv5{fill:#2f3fa6;stroke:none}
.g-p{stroke:#5b6b7b;stroke-width:1.6;fill:none}
.g-pbad{stroke:#d64545;stroke-width:1.6;fill:none}
.g-pgood{stroke:#2e9e5b;stroke-width:1.6;fill:none}
.g-pwarn{stroke:#d9a000;stroke-width:1.6;fill:none}
.g-dash{stroke-dasharray:5 4}
.g-ah{fill:#5b6b7b}
.g-ah-bad{fill:#d64545}
.g-ah-good{fill:#2e9e5b}
.g-today{stroke:#d64545;stroke-width:1.4;stroke-dasharray:3 3}
</style><defs><marker id="permission-retrieval-a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path class="g-ah" d="M0,0 L10,5 L0,10 z"/></marker><marker id="permission-retrieval-ab" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path class="g-ah-bad" d="M0,0 L10,5 L0,10 z"/></marker><marker id="permission-retrieval-ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path class="g-ah-good" d="M0,0 L10,5 L0,10 z"/></marker></defs><rect class="g-r g-r-box" x="20.0" y="40.0" width="128.0" height="70.0" rx="8"/><text class="g-text g-b" x="84.0" y="64.2" text-anchor="middle" style="font-size:12px">User request</text><text class="g-text" x="84.0" y="79.2" text-anchor="middle" style="font-size:12px">with a verified</text><text class="g-text" x="84.0" y="94.2" text-anchor="middle" style="font-size:12px">session token</text><rect class="g-r g-r-good" x="190.0" y="40.0" width="150.0" height="70.0" rx="8"/><text class="g-text g-b" x="265.0" y="64.2" text-anchor="middle" style="font-size:12px">Retrieval service</text><text class="g-text" x="265.0" y="79.2" text-anchor="middle" style="font-size:12px">reads identity and</text><text class="g-text" x="265.0" y="94.2" text-anchor="middle" style="font-size:12px">roles from the token</text><rect class="g-r g-r-good" x="382.0" y="40.0" width="150.0" height="70.0" rx="8"/><text class="g-text g-b" x="457.0" y="64.2" text-anchor="middle" style="font-size:12px">Vector query</text><text class="g-text" x="457.0" y="79.2" text-anchor="middle" style="font-size:12px">filtered by roles</text><text class="g-text" x="457.0" y="94.2" text-anchor="middle" style="font-size:12px">inside the query</text><rect class="g-r g-r-good" x="574.0" y="40.0" width="100.0" height="70.0" rx="8"/><text class="g-text g-b" x="624.0" y="71.5" text-anchor="middle" style="font-size:12px">Second check</text><text class="g-text" x="624.0" y="87.5" text-anchor="middle" style="font-size:12px">on results</text><rect class="g-r g-r-warn" x="704.0" y="40.0" width="80.0" height="70.0" rx="8"/><text class="g-text g-b" x="744.0" y="71.5" text-anchor="middle" style="font-size:12px">Prompt</text><text class="g-text" x="744.0" y="87.5" text-anchor="middle" style="font-size:12px">to model</text><path class="g-p" d="M150.0 75.0 L188.0 75.0" marker-end="url(#permission-retrieval-a)"/><path class="g-p" d="M342.0 75.0 L380.0 75.0" marker-end="url(#permission-retrieval-a)"/><path class="g-p" d="M534.0 75.0 L572.0 75.0" marker-end="url(#permission-retrieval-a)"/><path class="g-p" d="M676.0 75.0 L702.0 75.0" marker-end="url(#permission-retrieval-a)"/><rect class="g-r g-r-primary" x="362.0" y="160.0" width="190.0" height="56.0" rx="8"/><text class="g-text g-b" x="457.0" y="184.5" text-anchor="middle" style="font-size:12px">At ingestion</text><text class="g-text" x="457.0" y="200.5" text-anchor="middle" style="font-size:12px">tag chunks: class + roles</text><path class="g-p" d="M457.0 160.0 L457.0 112.0" marker-end="url(#permission-retrieval-a)"/><rect class="g-r g-r-bad" x="20.0" y="160.0" width="300.0" height="56.0" rx="8"/><text class="g-text g-b g-tbad" x="170.0" y="184.5" text-anchor="middle" style="font-size:12px">Never take identity from the prompt</text><text class="g-text" x="170.0" y="200.5" text-anchor="middle" style="font-size:12px">'I am the finance director' proves nothing</text><path class="g-pbad g-dash" d="M230.0 160.0 L265.0 112.0"/></svg>
