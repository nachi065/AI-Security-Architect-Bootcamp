chor="middle">+ roadmap</text><rect class="g-r g-r-good" x="620.0" y="30.0" width="160.0" height="128.0" rx="8"/><text class="g-text g-b g-tgood" x="700.0" y="66.5" text-anchor="middle">ARCHITECT</text><text class="g-text" x="700.0" y="82.5" text-anchor="middle">Volume 4 · 8 weeks</text><text class="g-text" x="700.0" y="98.5" text-anchor="middle">Secure architecture</text><text class="g-text" x="700.0" y="114.5" text-anchor="middle">Package + live</text><text class="g-text" x="700.0" y="130.5" text-anchor="middle">defence</text><path class="g-p" d="M182.0 94.0 L218.0 94.0" marker-end="url(#home-journey-a)"/><path class="g-p" d="M382.0 94.0 L418.0 94.0" marker-end="url(#home-journey-a)"/><path class="g-p" d="M582.0 94.0 L618.0 94.0" marker-end="url(#home-journey-a)"/><path class="g-p" d="M20.0 180.0 L20.0 190.0 L780.0 190.0 L780.0 180.0"/><text class="g-text g-s g-m" x="400.0" y="212.0" text-anchor="middle">One running case study: you fix the same system you built in Volume 1</text></svg>
