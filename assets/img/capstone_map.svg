<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" class="g-svg" viewBox="0 0 800 300" width="800" height="300" role="img" aria-label="Contents of the capstone package"><title>Contents of the capstone package</title><style>
.g-svg{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif}
.g-text{fill:#1f2933;font-size:13px}
