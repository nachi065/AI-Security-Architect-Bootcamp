</style><defs><marker id="three-lines-a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path class="g-ah" d="M0,0 L10,5 L0,10 z"/></marker><marker id="three-lines-ab" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path class="g-ah-bad" d="M0,0 L10,5 L0,10 z"/></marker><marker id="three-lines-ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path class="g-ah-good" d="M0,0 L10,5 L0,10 z"/></marker></defs><rect class="g-r g-r-primary" x="150.0" y="14.0" width="500.0" height="46.0" rx="8"/><text class="g-text g-b" x="400.0" y="33.5" text-anchor="middle" style="font-size:12px">Board and AI governance committee</text><text class="g-text" x="400.0" y="49.5" text-anchor="middle" style="font-size:12px">sets risk appetite, receives assurance</text><path class="g-p" d="M400.0 60.0 L400.0 82.0"/><path class="g-p" d="M140.0 82.0 L660.0 82.0"/><path class="g-p" d="M140.0 82.0 L140.0 108.0" marker-end="url(#three-lines-a)"/><rect class="g-r g-r-good" x="20.0" y="110.0" width="240.0" height="100.0" rx="8"/><text class="g-text g-b g-tgood" x="140.0" y="148.5" text-anchor="middle" style="font-size:12px">1st line · Own and operate</text><text class="g-text" x="140.0" y="164.5" text-anchor="middle" style="font-size:12px">Business and system owners</text><text class="g-text" x="140.0" y="180.5" text-anchor="middle" style="font-size:12px">run AI systems and controls</text><path class="g-p" d="M400.0 82.0 L400.0 108.0" marker-end="url(#three-lines-a)"/><rect class="g-r g-r-warn" x="280.0" y="110.0" width="240.0" height="100.0" rx="8"/><text class="g-text g-b g-twarn" x="400.0" y="148.5" text-anchor="middle" style="font-size:12px">2nd line · Oversee</text><text class="g-text" x="400.0" y="164.5" text-anchor="middle" style="font-size:12px">Risk, compliance, security</text><text class="g-text" x="400.0" y="180.5" text-anchor="middle" style="font-size:12px">set policy, monitor, challenge</text><path class="g-p" d="M660.0 82.0 L660.0 108.0" marker-end="url(#three-lines-a)"/><rect class="g-r g-r-primary" x="540.0" y="110.0" width="240.0" height="100.0" rx="8"/><text class="g-text g-b g-tprim" x="660.0" y="148.5" text-anchor="middle" style="font-size:12px">3rd line · Assure</text><text class="g-text" x="660.0" y="164.5" text-anchor="middle" style="font-size:12px">Internal audit</text><text class="g-text" x="660.0" y="180.5" text-anchor="middle" style="font-size:12px">independent assurance</text><rect class="g-r g-r-box" x="20.0" y="240.0" width="760.0" height="54.0" rx="8"/><text class="g-text g-b" x="400.0" y="263.5" text-anchor="middle" style="font-size:12px">Shared foundations</text><text class="g-text" x="400.0" y="279.5" text-anchor="middle" style="font-size:12px">AI inventory · risk tiering · policy stack · evidence</text></svg>
