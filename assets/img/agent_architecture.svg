<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" class="g-svg" viewBox="0 0 800 346" width="800" height="346" role="img" aria-label="Secure agent architecture: identity, tool gateway, approval, sandbox, kill switch"><title>Secure agent architecture: identity, tool gateway, approval, sandbox, kill switch</title><style>
