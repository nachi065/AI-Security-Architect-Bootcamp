<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" class="g-svg" viewBox="0 0 800 332" width="800" height="332" role="img" aria-label="Direct versus indirect prompt injection"><title>Direct versus indirect prompt injection</title><style>
.g-svg{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif}
.g-text{fill:#1f2933;font-size:13px}
.g-b{font-weight:700}
.g-s{font-size:11px}
.g-xs{font-size:10px}
.g-m{fill:#5b6b7b}
.g-tbad{fill:#b02a2a}
.g-tgood{fill:#1b7a44}
.g-twarn{fill:#8a6400}
.g-tprim{fill:#2b3990}
.g-ton{fill:#ffffff}
.g-r{stroke-width:1.3}
.g-r-box{fill:#f3f5f9;stroke:#9aa7b8}
.g-r-primary{fill:#e4e9ff;stroke:#4051b5}
.g-r-good{fill:#e3f6ea;stroke:#2e9e5b}
.g-r-warn{fill:#fff3d6;stroke:#d9a000}
.g-r-bad{fill:#fde7e7;stroke:#d64545}
.g-r-zone{fill:none;stroke:#5b6b7b;stroke-dasharray:6 4}
.g-r-zonebad{fill:none;stroke:#d64545;stroke-dasharray:6 4}
.g-r-lv1{fill:#eef0fb;stroke:none}
.g-r-lv2{fill:#cdd3f4;stroke:none}
.g-r-lv3{fill:#9aa6e8;stroke:none}
.g-r-lv4{fill:#5c6dd0;stroke:none}
.g-r-lv5{fill:#2f3fa6;stroke:none}
.g-p{stroke:#5b6b7b;stroke-width:1.6;fill:none}
.g-pbad{stroke:#d64545;stroke-width:1.6;fill:none}
.g-pgood{stroke:#2e9e5b;stroke-width:1.6;fill:none}
.g-pwarn{stroke:#d9a000;stroke-width:1.6;fill:none}
.g-dash{stroke-dasharray:5 4}
.g-ah{fill:#5b6b7b}
.g-ah-bad{fill:#d64545}
.g-ah-good{fill:#2e9e5b}
.g-today{stroke:#d64545;stroke-width:1.4;stroke-dasharray:3 3}
</style><defs><marker id="injection-a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path class="g-ah" d="M0,0 L10,5 L0,10 z"/></marker><marker id="injection-ab" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path class="g-ah-bad" d="M0,0 L10,5 L0,10 z"/></marker><marker id="injection-ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path class="g-ah-good" d="M0,0 L10,5 L0,10 z"/></marker></defs><text class="g-text g-b g-s g-tbad" x="20.0" y="24.0" text-anchor="start">DIRECT: the user is the attacker</text><rect class="g-r g-r-bad" x="20.0" y="38.0" width="100.0" height="56.0" rx="8"/><text class="g-text g-b" x="70.0" y="62.5" text-anchor="middle" style="font-size:12px">User</text><text class="g-text" x="70.0" y="78.5" text-anchor="middle" style="font-size:12px">types a trick</text><rect class="g-r g-r-box" x="170.0" y="38.0" width="160.0" height="56.0" rx="8"/><text class="g-text g-b" x="250.0" y="62.5" text-anchor="middle" style="font-size:12px">Application</text><text class="g-text" x="250.0" y="78.5" text-anchor="middle" style="font-size:12px">system prompt + input</text><rect class="g-r g-r-warn" x="380.0" y="38.0" width="100.0" height="56.0" rx="8"/><text class="g-text g-b" x="430.0" y="70.5" text-anchor="middle" style="font-size:12px">LLM</text><rect class="g-r g-r-bad" x="530.0" y="38.0" width="160.0" height="56.0" rx="8"/><text class="g-text g-b" x="610.0" y="62.5" text-anchor="middle" style="font-size:12px">Rules ignored</text><text class="g-text" x="610.0" y="78.5" text-anchor="middle" style="font-size:12px">or prompt leaked</text><path class="g-p" d="M122.0 66.0 L168.0 66.0" marker-end="url(#injection-a)"/><path class="g-p" d="M332.0 66.0 L378.0 66.0" marker-end="url(#injection-a)"/><path class="g-p" d="M482.0 66.0 L528.0 66.0" marker-end="url(#injection-a)"/><text class="g-text g-b g-s g-tbad" x="20.0" y="142.0" text-anchor="start">INDIRECT: the attacker is not in the chat</text><rect class="g-r g-r-bad" x="20.0" y="156.0" width="100.0" height="56.0" rx="8"/><text class="g-text g-b" x="70.0" y="180.5" text-anchor="middle" style="font-size:12px">Attacker</text><text class="g-text" x="70.0" y="196.5" text-anchor="middle" style="font-size:12px">plants text</text><rect class="g-r g-r-bad" x="150.0" y="156.0" width="140.0" height="56.0" rx="8"/><text class="g-text g-b" x="220.0" y="180.5" text-anchor="middle" style="font-size:12px">Web page / file</text><text class="g-text" x="220.0" y="196.5" text-anchor="middle" style="font-size:12px">email, tool output</text><rect class="g-r g-r-box" x="320.0" y="156.0" width="120.0" height="56.0" rx="8"/><text class="g-text g-b" x="380.0" y="180.5" text-anchor="middle" style="font-size:12px">Application</text><text class="g-text" x="380.0" y="196.5" text-anchor="middle" style="font-size:12px">fetches content</text><rect class="g-r g-r-warn" x="470.0" y="156.0" width="90.0" height="56.0" rx="8"/><text class="g-text g-b" x="515.0" y="188.5" text-anchor="middle" style="font-size:12px">LLM</text><rect class="g-r g-r-bad" x="590.0" y="156.0" width="190.0" height="56.0" rx="8"/><text class="g-text g-b" x="685.0" y="180.5" text-anchor="middle" style="font-size:11px">Unintended action</text><text class="g-text" x="685.0" y="196.5" text-anchor="middle" style="font-size:11px">data sent out, tool misused</text><path class="g-p" d="M122.0 184.0 L148.0 184.0" marker-end="url(#injection-a)"/><path class="g-p" d="M292.0 184.0 L318.0 184.0" marker-end="url(#injection-a)"/><path class="g-p" d="M442.0 184.0 L468.0 184.0" marker-end="url(#injection-a)"/><path class="g-p" d="M562.0 184.0 L588.0 184.0" marker-end="url(#injection-a)"/><text class="g-text g-s g-m" x="400.0" y="262.0" text-anchor="middle">Why it works: instructions and data arrive as one stream of text in the model's context.</text><text class="g-text g-s g-m" x="400.0" y="282.0" text-anchor="middle">So reduce what a manipulated model is able to do, instead of trusting it to refuse.</text></svg>
