<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" class="g-svg" viewBox="0 0 800 335" width="800" height="335" role="img" aria-label="RAG pipeline: ingest documents offline, retrieve and answer online"><title>RAG pipeline: ingest documents offline, retrieve and answer online</title><style>
.g-svg{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif}
.g-text{fill:#1f2933;font-size:13px}
