40.0" r="6"/><text class="g-text g-b g-twarn" x="322.1" y="71.0" text-anchor="middle" style="font-size:12px">27 Jul 2026</text><text class="g-text g-s" x="322.1" y="85.0" text-anchor="middle">Digital Omnibus</text><text class="g-text g-s" x="322.1" y="99.0" text-anchor="middle">in force</text><path class="g-p g-dash" d="M325.0 140.0 L325.0 176.0"/><circle class="g-r g-r-primary" cx="325.0" cy="140.0" r="6"/><text class="g-text g-b g-tprim" x="325.0" y="201.0" text-anchor="middle" style="font-size:12px">2 Aug 2026</text><text class="g-text g-s" x="325.0" y="215.0" text-anchor="middle">Article 50</text><text class="g-text g-s" x="325.0" y="229.0" text-anchor="middle">transparency</text><path class="g-p g-dash" d="M385.2 140.0 L385.2 62.0"/><circle class="g-r g-r-warn" cx="385.2" cy="140.0" r="6"/><text class="g-text g-b g-twarn" x="385.2" y="29.0" text-anchor="middle" style="font-size:12px">2 Dec 2026*</text><text class="g-text g-s" x="385.2" y="43.0" text-anchor="middle">grace date for some</text><text class="g-text g-s" x="385.2" y="57.0" text-anchor="middle">duties (verify)</text><path class="g-p g-dash" d="M565.2 140.0 L565.2 176.0"/><circle class="g-r g-r-good" cx="565.2" cy="140.0" r="6"/><text class="g-text g-b g-tgood" x="565.2" y="201.0" text-anchor="middle" style="font-size:12px">2 Dec 2027</text><text class="g-text g-s" x="565.2" y="215.0" text-anchor="middle">Annex III high-risk</text><text class="g-text g-s" x="565.2" y="229.0" text-anchor="middle">(deferred)</text><path class="g-p g-dash" d="M685.5 140.0 L685.5 104.0"/><circle class="g-r g-r-good" cx="685.5" cy="140.0" r="6"/><text class="g-text g-b g-tgood" x="685.5" y="71.0" text-anchor="middle" style="font-size:12px">2 Aug 2028</text><text class="g-text g-s" x="685.5" y="85.0" text-anchor="middle">Annex I embedded</text><text class="g-text g-s" x="685.5" y="99.0" text-anchor="middle">products (deferred)</text><path class="g-today" d="M356.6 116.0 L356.6 164.0"/><text class="g-text g-b g-s g-tbad" x="3